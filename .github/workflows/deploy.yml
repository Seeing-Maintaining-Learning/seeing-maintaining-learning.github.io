name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [corpus-updated]
  schedule:
    - cron: '23 * * * *' # hourly: publish newly merged corpus records

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # On the hourly schedule, rebuild only when the corpus moved past what the live site was built from.
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
    steps:
      - id: cmp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          latest=$(gh api repos/Seeing-Maintaining-Learning/multimodal-agent-memory-evolution/commits/main --jq .sha)
          live=$(curl -fsSL https://seeing-maintaining-learning.github.io/corpus-revision.txt || echo none)
          echo "latest=$latest live=$live"
          if [ "$latest" = "$live" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sync corpus
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Type check
        run: npx astro check
      - name: Check data against the paper
        run: npm test
      - name: Build
        run: npx astro build
        env:
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
